<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask-chat</title>
  <link rel="icon" type="image/png" href="chat.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <button class="theme-toggle" id="themeToggle" title="Alternar tema">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
  <button class="sidebar-expand-btn" id="sidebarExpandBtn" title="Expandir sidebar">»</button>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Chats</h2>
        <div class="header-buttons">
          <button class="new-chat-btn" id="newChatBtn" title="Novo chat">+</button>
          <button class="toggle-sidebar-btn" id="toggleSidebarBtn" title="Recolher/Expandir">«</button>
        </div>
      </div>
      <ul class="chat-history" id="chatHistory"></ul>
    </aside>
    <main class="chat-main">
      <header class="chat-header">
        <div class="header-title-container">
          <img src="chat.png" alt="Chat Icon" class="header-icon">
          <h1>Ask-chat</h1>
        </div>
        <div class="header-controls">
          <a href="/server" class="remote-copilot-link" title="Abrir Copiloto Remoto do Helper Node" style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:rgba(41,182,246,0.12); border:1px solid rgba(41,182,246,0.3); border-radius:6px; color:#29b6f6; text-decoration:none; font-size:12px; font-weight:600;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
            <span>Copiloto Live</span>
          </a>
          <label for="modelSelect" class="model-select-label">Modelo:</label>
          <select id="modelSelect" class="model-select" title="Selecione o modelo ou endpoint">
            <option value="/llama3-rag" selected>Llama 3 + RAG (Java 17-27 & Spring)</option>
            <option value="/llama3">Llama 3 (Padrao)</option>
            <option value="/llamatiny">TinyLlama</option>
            <option value="/gemma3">Gemma 3</option>
            <option value="/qwen25">Qwen 2.5</option>
          </select>
        </div>
      </header>
      <section class="messages" id="messages"></section>
      <form class="input-area" id="chatForm">
        <textarea id="userInput" placeholder="Digite sua pergunta..." rows="1" autocomplete="off" required></textarea>
        <button type="submit" id="sendBtn">Enviar</button>
      </form>
    </main>
  </div>
  <script src="chat.js"></script>
</body>
</html>
